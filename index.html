<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bintan — Motion</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;font-family:'Playfair Display',serif;background:#000;color:#fff}
  #bg{position:absolute;inset:0;background:linear-gradient(160deg,#0f2023_0%,#164255_40%,#306376_70%,#6aafa7_100%);}
  .star{position:absolute;background:#fff;border-radius:50%;opacity:.85}
  canvas{display:block;position:absolute;inset:0}
  .hero{position:absolute;inset:0;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:10}
  .hero h1{font-size:clamp(3rem,10vw,7rem);font-weight:300;letter-spacing:.05em;background:linear-gradient(120deg,#fff 0%,#d4af37 50%,#fff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;transform:translateY(40px);opacity:0;animation:reveal 2s ease forwards .3s both;padding:0 1rem}
  .hero h1 span{display:block;font-family:'Crimson Text',serif;font-weight:300;font-size:clamp(1rem,3vw,2rem);margin-top:.5rem;color:#d4af37;letter-spacing:.2em;text-transform:lowercase}
  @keyframes reveal{to{transform:translateY(0);opacity:1}}
  .mount{position:absolute;left:0;right:0;bottom:0;height:60%;background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="60" viewBox="0 0 100 60"><path d="M0 50 Q25 30 50 45 T100 25 V60 H0 Z" fill="%23000" fill-opacity=".3"/></svg>') repeat-x bottom;background-size:100px 60px}
  .credit{position:absolute;bottom:1rem;left:0;right:0;text-align:center;font-size:.7rem;opacity:.5;z-index:20}
  @media(max-width:600px){.mount{height:40%}}
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="canvas"></canvas>
<div class="mount"></div>
<div class="hero">
  <h1>Bintan<span>puisi dari tebing karang</span></h1>
  <div class="credit">motion graphics via code · HTML5 Canvas + JS</div>
</div>
<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let stars = [];
  let particles = [];
  let w, h;
  const resize = () => {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  };
  window.addEventListener('resize', resize);
  resize();

  // stars
  for (let i = 0; i < 420; i++) {
    stars.push({x: Math.random()*w, y: Math.random()*h, r: Math.random()*1.4, o: Math.random()*0.8+0.1});
  }
  for (let i = 0; i < 60; i++) {
    stars.push({x: Math.random()*w, y: Math.random()*h, r: Math.random()*2.2+1, o: Math.random()*0.3+0.15, twinkle: Math.random()*2});
  }

  // initial particles burst at center
  const cx = w/2, cy = h*0.65;
  for (let i = 0; i < 60; i++) {
    const a = Math.random()*Math.PI*2;
    const sp = Math.random()*1.6+0.4;
    particles.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,decay:Math.random()*0.005+0.003, hue:Math.random()*40+20});
  }

  let t = 0;
  function loop() {
    ctx.clearRect(0,0,w,h);
    // stars
    ctx.fillStyle = '#fff';
    stars.forEach(s => {
      ctx.globalAlpha = s.o + (s.twinkle ? Math.sin(t*3+s.x)*0.05 : 0);
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    // particles
    ctx.fillStyle = '#d4af37';
    particles = particles.filter(p => p.life > 0);
    particles.forEach(p => {
      p.life -= p.decay;
      p.vx += (Math.random()-0.5)*0.02;
      p.vy += 0.01; // gravity
      p.x += p.vx;
      p.y += p.vy;
      ctx.globalAlpha = Math.max(0,p.life*0.9);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.life*2.2+0.3, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    // occasional new particles
    if (Math.random() < 0.35) {
      const a = Math.random()*Math.PI*2;
      const sp = Math.random()*1.8+0.5;
      particles.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,decay:Math.random()*0.004+0.002,hue:Math.random()*40+20});
    }
    t += 0.016;
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
</html>
